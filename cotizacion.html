<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="css/style.css">
    <title>Casey Reas</title>
</head>
<body>
        <header>
            <p>Casey Reas</p>
            <nav>
                <ul>
                    <li><a href="index.htm">Inicio</a></li>
                    <li><a href="obras.html">Obras</a></li>
                    <li><a href="#">Cotizacion</a></li>
                </ul>
            </nav>
        </header> 
<main id="contenedor">
            <form class="form-insta">
            <fieldset class="config">
                        <legend>Configuración General</legend>
                        <label for="cant_instalaciones">Cantidad de instalaciones</label>
                        <input type="number" name="cant-instalaciones" id="cant_instalaciones" min="1">
                        <label for="paga_hora">Paga por hora</label>
                        <input type="number" name="paga-hora" id="paga_hora" min="1">
                        <button type="button" id="bt-confir">Confirmar</button>
            </fieldset>
            <fieldset class="datos">
                            <legend>Datos del intalacion</legend>
                            <label for="nombre_obra">Nombre</label>
                            <input type="text" name="nombre-obra" id="nombre_obra">
                            <label for="perNece">Personas necesarias</label>
                            <input type="number" name="personas" id="perNece" min="1">
                            <label for="dProdu">Días de producción</label>
                            <input type="number" name="diaProdu" id="dProdu" min="1">
                            <label for="hXdia">Horas de Montaje por dia</label>
                            <input type="number" name="horaXdia" id="hXdia" min="1" max="24">
                            <button type="button" id="btn-agregar">Agregar</button>
                            <button type="button" id="btn-calcular">Calcular</button>
                            <button type="reset" id="btn-reset">Resetar</button>
                </fieldset>
            </form>
</main>
     <footer>
        <address>
            <p>Para contactarse escribir a
            <a href="casey@artedigital.com">casey@artedigital.com</a></p>
        </address>
    </footer>
    <script src="js/formulario.js"></script>
</body>
</html>
